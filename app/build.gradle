plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.masatolab.kanon'
    compileSdk Integer.parseInt(System.getenv('KANON_COMPILE_SDK') ?: '35')

    defaultConfig {
        applicationId 'jp.masatolab.kanon'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
